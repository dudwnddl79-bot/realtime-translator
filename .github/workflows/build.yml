      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 환경 진단
        run: |
          echo "::notice title=env::java=$(java -version 2>&1 | head -1) | ANDROID_HOME=${ANDROID_HOME:-unset} | platforms=$(ls ${ANDROID_HOME:-/nonexistent}/platforms 2>/dev/null | tr '\n' ' ') | cmdline=$(ls ${ANDROID_HOME:-/nonexistent}/cmdline-tools 2>/dev/null | tr '\n' ' ')"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Android SDK 라이선스 수락
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1) || true
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null 2>&1 || true; fi
          echo "::notice title=sdk::sdkmanager=${SDKM:-none}"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            MSG=$(grep -E "^e: |error:|What went wrong|Execution failed|Could not |Unresolved|FAILED|^> " build.log | head -25 | sed 's/%/%25/g' | paste -sd '|' -)
            echo "::error title=빌드 실패::${MSG}"
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: realtime-translator-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
