          package com.realtime.translator.service

          import android.annotation.SuppressLint
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.TextView
          import com.realtime.translator.R

          class FloatingSubtitleService : Service() {

              private var wm: WindowManager? = null
              private var root: View? = null
              private var tv: TextView? = null
              private var tvPrev: TextView? = null
              private var lp: WindowManager.LayoutParams? = null
              private var lastSubtitle = ""
              private val hide = Runnable {
                  root?.visibility = View.GONE
                  lastSubtitle = ""
              }

              override fun onBind(intent: Intent?): IBinder? = null

              @SuppressLint("ClickableViewAccessibility", "InflateParams")
              override fun onCreate() {
                  super.onCreate()
                  val manager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  wm = manager
                  val sp = getSharedPreferences(Cfg.PREFS, Context.MODE_PRIVATE)
                  val dm = resources.displayMetrics
                  val w = (dm.widthPixels * 0.92f).toInt()
                  val px = sp.getInt("posX", -1)
                  val py = sp.getInt("posY", -1)
                  val params = WindowManager.LayoutParams(
                      w,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = if (px < 0) (dm.widthPixels - w) / 2 else px
                  params.y = if (py < 0) (dm.heightPixels * 0.72f).toInt() else py
                  clamp(params)
                  lp = params

                  val v = LayoutInflater.from(this).inflate(R.layout.overlay_subtitle, null)
                  tv = v.findViewById<TextView>(R.id.tvKorean)
                  tvPrev = v.findViewById<TextView>(R.id.tvPrev)

                  // 드래그로 위치 이동, 손을 떼면 위치 기억
                  var startX = 0
                  var startY = 0
                  var downX = 0f
                  var downY = 0f
                  v.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              downX = e.rawX
                              downY = e.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (e.rawX - downX).toInt()
                              params.y = startY + (e.rawY - downY).toInt()
                              clamp(params)
                              try { manager.updateViewLayout(v, params) } catch (ex: Exception) { }
                              true
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              sp.edit().putInt("posX", params.x).putInt("posY", params.y).apply()
                              true
                          }
                          else -> false
                      }
                  }
                  manager.addView(v, params)
                  root = v
                  instance = this
                  applyStyle()
                  tv?.text = "자막 준비 완료 - 이 창을 드래그해서 위치를 옮기세요"
                  main.postDelayed(hide, 6000)
              }

              private fun clamp(p: WindowManager.LayoutParams) {
                  val dm = resources.displayMetrics
                  p.x = p.x.coerceIn(0, maxOf(0, dm.widthPixels - p.width))
                  p.y = p.y.coerceIn(0, maxOf(0, dm.heightPixels - 120))
              }

              /** 글자 크기/배경 농도를 설정에서 읽어 즉시 반영 */
              private fun applyStyle() {
                  val sp = getSharedPreferences(Cfg.PREFS, Context.MODE_PRIVATE)
                  val size = sp.getInt("fontSp", 20)
                  val alpha = sp.getInt("bgAlpha", 0xCC)
                  tv?.textSize = size.toFloat()
                  tvPrev?.textSize = size * 0.75f
                  root?.setBackgroundColor(alpha shl 24)
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  val p = lp ?: return
                  p.width = (resources.displayMetrics.widthPixels * 0.92f).toInt()
                  clamp(p)
                  root?.let { try { wm?.updateViewLayout(it, p) } catch (e: Exception) { } }
              }

              override fun onDestroy() {
                  instance = null
                  main.removeCallbacks(hide)
                  root?.let { try { wm?.removeView(it) } catch (e: Exception) { } }
                  root = null
                  super.onDestroy()
              }

              companion object {
                  @Volatile private var instance: FloatingSubtitleService? = null
                  private val main = Handler(Looper.getMainLooper())

                  /**
                   * 어느 스레드에서든 호출 가능. holdMs 뒤에 자막창을 숨긴다.
                   * isStatus=true 면 안내/오류 문구라서 "직전 자막" 줄에 쌓지 않는다.
                   */
                  fun show(text: String, holdMs: Long = 7000, isStatus: Boolean = false) {
                      main.post {
                          val s = instance ?: return@post
                          s.applyStyle()
                          val prevView = s.tvPrev
                          if (isStatus) {
                              prevView?.visibility = View.GONE
                          } else {
                              val visible = s.root?.visibility == View.VISIBLE
                              if (visible && s.lastSubtitle.isNotEmpty()) {
                                  prevView?.text = s.lastSubtitle
                                  prevView?.visibility = View.VISIBLE
                              } else {
                                  prevView?.visibility = View.GONE
                              }
                              s.lastSubtitle = text
                          }
                          s.tv?.text = text
                          s.root?.visibility = View.VISIBLE
                          main.removeCallbacks(s.hide)
                          main.postDelayed(s.hide, holdMs)
                      }
                  }
              }
          }
