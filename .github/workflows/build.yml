          package com.realtime.translator.service

          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL

          data class TranslateResult(val text: String?, val error: String?)

          /** 음성(PCM 16kHz mono) -> 한국어 자막. Gemini 한 번 호출로 인식+번역을 동시에 처리. */
          object Translator {
              const val DEFAULT_MODEL = "gemini-3.8-flash"

              // 모델이 thinkingLevel 을 거부하면(400) 한 번만 끄고 재시도
              @Volatile private var thinking = true

              private class Raw(val code: Int, val body: String)

              fun translate(pcm: ShortArray, cfg: Cfg, prev: List<String>): TranslateResult {
                  if (cfg.key.isEmpty()) return TranslateResult(null, "API 키가 비어 있어요")
                  val b64 = Base64.encodeToString(Wav.encode(pcm, 16000), Base64.NO_WRAP)
                  val parts = JSONArray()
                      .put(JSONObject().put("text", Sub.prompt(cfg.lang, cfg.glossary, prev)))
                      .put(JSONObject().put("inline_data", JSONObject().put("mime_type", "audio/wav").put("data", b64)))
                  return send(parts, cfg, true)
              }

              /** 키/모델이 맞는지 짧은 텍스트 요청으로 확인 */
              fun test(cfg: Cfg): String {
                  if (cfg.key.isEmpty()) return "❌ API 키를 먼저 입력하세요"
                  val t0 = System.nanoTime()
                  val parts = JSONArray().put(JSONObject().put("text", "OK 라고만 답해."))
                  val r = send(parts, cfg, false)
                  val ms = (System.nanoTime() - t0) / 1_000_000L
                  val err = r.error
                  return if (err != null) "❌ " + err else "✅ 키와 모델 정상 (" + cfg.model + ", " + ms + "ms)"
              }

              private fun send(parts: JSONArray, cfg: Cfg, retry: Boolean): TranslateResult {
                  var attempt = 0
                  while (true) {
                      attempt++
                      try {
                          var r = call(parts, cfg, thinking)
                          if (r.code == 400 && thinking) {
                              thinking = false
                              r = call(parts, cfg, false)
                          }
                          if (r.code >= 500 && retry && attempt < 2) {
                              Thread.sleep(400)
                              continue
                          }
                          return parse(r)
                      } catch (e: IOException) {
                          if (retry && attempt < 2) {
                              Thread.sleep(400)
                              continue
                          }
                          return TranslateResult(null, "네트워크 오류: " + (e.message ?: e.javaClass.simpleName))
                      } catch (e: Exception) {
                          return TranslateResult(null, "오류: " + (e.message ?: e.javaClass.simpleName))
                      }
                  }
              }

              private fun call(parts: JSONArray, cfg: Cfg, think: Boolean): Raw {
                  val gen = JSONObject().put("temperature", 0.2)
                  if (think) gen.put("thinkingConfig", JSONObject().put("thinkingLevel", "low"))
                  val body = JSONObject()
                      .put("contents", JSONArray().put(JSONObject().put("parts", parts)))
                      .put("generationConfig", gen)

                  val url = URL("https://generativelanguage.googleapis.com/v1beta/models/" + cfg.model + ":generateContent")
                  val c = url.openConnection() as HttpURLConnection
                  try {
                      c.requestMethod = "POST"
                      c.connectTimeout = 8000
                      c.readTimeout = 25000
                      c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json")
                      c.setRequestProperty("x-goog-api-key", cfg.key)
                      c.outputStream.use { it.write(body.toString().toByteArray()) }
                      val code = c.responseCode
                      val st = if (code in 200..299) c.inputStream else c.errorStream
                      val text = st?.bufferedReader()?.use { it.readText() } ?: ""
                      return Raw(code, text)
                  } finally {
                      c.disconnect()
                  }
              }

              private fun parse(r: Raw): TranslateResult {
                  if (r.code !in 200..299) {
                      val msg = try {
                          JSONObject(r.body).getJSONObject("error").getString("message")
                      } catch (e: Exception) {
                          r.body
                      }
                      val head = when (r.code) {
                          400 -> "요청 오류"
                          401, 403 -> "API 키/권한 오류"
                          404 -> "모델 이름 오류"
                          429 -> "요청 한도 초과(잠시 후 자동 재시도)"
                          else -> "서버 오류"
                      }
                      return TranslateResult(null, head + " (" + r.code + ") " + msg.take(60))
                  }
                  return try {
                      val parts = JSONObject(r.body).optJSONArray("candidates")
                          ?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts")
                      val sb = StringBuilder()
                      if (parts != null) {
                          for (i in 0 until parts.length()) {
                              val p = parts.getJSONObject(i)
                              if (!p.optBoolean("thought", false)) sb.append(p.optString("text", ""))
                          }
                      }
                      TranslateResult(Sub.clean(sb.toString()), null)
                  } catch (e: Exception) {
                      TranslateResult(null, "응답 해석 오류")
                  }
              }
          }
