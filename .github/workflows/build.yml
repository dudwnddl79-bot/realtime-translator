name: APK 자동 빌드

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 프로젝트 파일 자동 생성
        run: |
          set -e
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/realtime/translator/service
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "realtime-translator"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.10" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.realtime.translator"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.realtime.translator"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Translator">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".service.AudioCaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
                  <service
                      android:name=".service.FloatingSubtitleService"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">실시간 번역 자막</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Translator" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@color/black</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F0F0F"
              android:fillViewport="true">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="실시간 AI 번역 - 내부오디오"
                      android:textColor="#FFFFFF"
                      android:textSize="22sp"
                      android:textStyle="bold" />
                  <EditText
                      android:id="@+id/etKey"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:hint="Gemini API 키 붙여넣기"
                      android:inputType="textNoSuggestions"
                      android:maxLines="1"
                      android:textColor="#FFFFFF"
                      android:textColorHint="#777777" />
                  <EditText
                      android:id="@+id/etModel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="모델 이름"
                      android:inputType="textNoSuggestions"
                      android:maxLines="1"
                      android:textColor="#FFFFFF"
                      android:textColorHint="#777777" />
                  <EditText
                      android:id="@+id/etGlossary"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="용어집(선택) 예: ミコト=미코토, 先輩=센파이"
                      android:inputType="textMultiLine"
                      android:maxLines="3"
                      android:textColor="#FFFFFF"
                      android:textColorHint="#777777" />
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:orientation="horizontal">
                      <Button
                          android:id="@+id/btnLang"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="언어: 자동 인식" />
                      <Button
                          android:id="@+id/btnTest"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="키 테스트" />
                  </LinearLayout>
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">
                      <Button
                          android:id="@+id/btnFontMinus"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="글자 -" />
                      <Button
                          android:id="@+id/btnFontPlus"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="글자 +" />
                      <Button
                          android:id="@+id/btnAlpha"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="배경: 보통" />
                  </LinearLayout>
                  <Button
                      android:id="@+id/btnBattery"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="배터리 제한 해제 설정 열기 (삼성 권장)" />
                  <Button
                      android:id="@+id/btnStart"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:layout_marginTop="16dp"
                      android:text="번역 시작 (내부오디오 캡처)" />
                  <Button
                      android:id="@+id/btnStop"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:layout_marginTop="8dp"
                      android:text="중지" />
                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="API 키 입력 후 '키 테스트'로 확인하고, 시작을 누른 뒤 영상 앱에서 소리를 재생하세요"
                      android:textColor="#AAAAAA" />
              </LinearLayout>
          </ScrollView>
          EOF

          cat > app/src/main/res/layout/overlay_subtitle.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="#CC000000"
              android:orientation="vertical"
              android:padding="14dp">
              <TextView
                  android:id="@+id/tvPrev"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#99FFFFFF"
                  android:textSize="15sp"
                  android:visibility="gone" />
              <TextView
                  android:id="@+id/tvKorean"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:shadowColor="#000000"
                  android:shadowDx="1"
                  android:shadowDy="1"
                  android:shadowRadius="3"
                  android:text="한글 자막이 여기에 표시됩니다"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/realtime/translator/MainActivity.kt <<'EOF'
          package com.realtime.translator

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.realtime.translator.service.AudioCaptureService
          import com.realtime.translator.service.Cfg
          import com.realtime.translator.service.Translator

          class MainActivity : AppCompatActivity() {

              private lateinit var mgr: MediaProjectionManager
              private lateinit var status: TextView
              private lateinit var etKey: EditText
              private lateinit var etModel: EditText
              private lateinit var etGlossary: EditText
              private lateinit var btnLang: Button
              private lateinit var btnAlpha: Button

              private val langCodes = arrayOf("auto", "ja", "zh", "en", "ru")
              private val langNames = arrayOf("자동 인식", "일본어", "중국어", "영어", "러시아어")
              private val alphaVals = intArrayOf(0xE6, 0xCC, 0x80)
              private val alphaNames = arrayOf("진하게", "보통", "연하게")

              private val projectionLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      val d = r.data
                      if (r.resultCode == Activity.RESULT_OK && d != null) {
                          val i = Intent(this, AudioCaptureService::class.java)
                              .putExtra("resultCode", r.resultCode)
                              .putExtra("data", d)
                          ContextCompat.startForegroundService(this, i)
                          status.text = "캡처 시작 - 이제 영상 앱에서 소리를 재생하세요 (알림창에서도 중지할 수 있어요)"
                      } else {
                          status.text = "화면 캡처 권한이 거부되었습니다"
                      }
                  }

              private val permLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      if (hasAudioPermission()) {
                          projectionLauncher.launch(mgr.createScreenCaptureIntent())
                      } else {
                          status.text = "녹음 권한이 필요합니다 (내부오디오 캡처 API 필수 조건)"
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  status = findViewById<TextView>(R.id.tvStatus)
                  etKey = findViewById<EditText>(R.id.etKey)
                  etModel = findViewById<EditText>(R.id.etModel)
                  etGlossary = findViewById<EditText>(R.id.etGlossary)
                  btnLang = findViewById<Button>(R.id.btnLang)
                  btnAlpha = findViewById<Button>(R.id.btnAlpha)

                  val p = sp()
                  etKey.setText(p.getString("key", ""))
                  etModel.setText(p.getString("model", Translator.DEFAULT_MODEL))
                  etGlossary.setText(p.getString("glossary", ""))
                  refreshButtons()

                  btnLang.setOnClickListener {
                      val i = langCodes.indexOf(sp().getString("lang", "auto")).coerceAtLeast(0)
                      sp().edit().putString("lang", langCodes[(i + 1) % langCodes.size]).apply()
                      refreshButtons()
                  }
                  btnAlpha.setOnClickListener {
                      val cur = alphaVals.indexOf(sp().getInt("bgAlpha", 0xCC))
                      val i = if (cur < 0) 1 else cur
                      sp().edit().putInt("bgAlpha", alphaVals[(i + 1) % alphaVals.size]).apply()
                      refreshButtons()
                  }
                  findViewById<Button>(R.id.btnFontMinus).setOnClickListener { changeFont(-2) }
                  findViewById<Button>(R.id.btnFontPlus).setOnClickListener { changeFont(2) }
                  findViewById<Button>(R.id.btnTest).setOnClickListener { testKey() }
                  findViewById<Button>(R.id.btnBattery).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                      status.text = "목록에서 이 앱을 찾아 '최적화 안 함'으로 바꾸면 오래 켜둬도 안 꺼져요"
                  }
                  findViewById<Button>(R.id.btnStart).setOnClickListener { begin() }
                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(Intent(this, AudioCaptureService::class.java))
                      status.text = "중지됨"
                  }
              }

              override fun onPause() {
                  saveFields()
                  super.onPause()
              }

              private fun sp() = getSharedPreferences(Cfg.PREFS, Context.MODE_PRIVATE)

              private fun saveFields() {
                  sp().edit()
                      .putString("key", etKey.text.toString().trim())
                      .putString("model", etModel.text.toString().trim())
                      .putString("glossary", etGlossary.text.toString().trim())
                      .apply()
              }

              private fun refreshButtons() {
                  val p = sp()
                  val li = langCodes.indexOf(p.getString("lang", "auto")).coerceAtLeast(0)
                  btnLang.text = "언어: " + langNames[li]
                  val cur = alphaVals.indexOf(p.getInt("bgAlpha", 0xCC))
                  btnAlpha.text = "배경: " + alphaNames[if (cur < 0) 1 else cur]
              }

              private fun changeFont(delta: Int) {
                  val f = (sp().getInt("fontSp", 20) + delta).coerceIn(14, 36)
                  sp().edit().putInt("fontSp", f).apply()
                  status.text = "자막 글자 크기: " + f
              }

              private fun testKey() {
                  saveFields()
                  val cfg = Cfg.load(this)
                  status.text = "키/모델 테스트 중..."
                  Thread {
                      val msg = Translator.test(cfg)
                      runOnUiThread { status.text = msg }
                  }.start()
              }

              private fun hasAudioPermission() =
                  ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) ==
                      PackageManager.PERMISSION_GRANTED

              private fun begin() {
                  saveFields()
                  if (Cfg.load(this).key.isEmpty()) {
                      status.text = "먼저 Gemini API 키를 입력하세요 (aistudio.google.com/apikey 에서 발급)"
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      status.text = "'다른 앱 위에 표시'를 켠 뒤 돌아와서 다시 누르세요"
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName))
                      )
                      return
                  }
                  val need = mutableListOf<String>()
                  if (!hasAudioPermission()) need.add(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) !=
                      PackageManager.PERMISSION_GRANTED
                  ) need.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (need.isNotEmpty()) {
                      permLauncher.launch(need.toTypedArray())
                  } else {
                      projectionLauncher.launch(mgr.createScreenCaptureIntent())
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/realtime/translator/service/AudioCaptureService.kt <<'EOF'
          package com.realtime.translator.service

          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioPlaybackCaptureConfiguration
          import android.media.AudioRecord
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.widget.Toast
          import androidx.core.content.ContextCompat
          import java.util.concurrent.LinkedBlockingDeque
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicInteger

          class AudioCaptureService : Service() {

              private class Job(val seq: Int, val pcm: ShortArray, val t0: Long)
              private class Done(val r: TranslateResult?, val ms: Long)

              private var projection: MediaProjection? = null
              private var record: AudioRecord? = null
              private var capThread: Thread? = null
              private val workers = ArrayList<Thread>()
              @Volatile private var running = false

              private val queue = LinkedBlockingDeque<Job>()
              private val seqGen = AtomicInteger(0)

              // 아래 4개는 synchronized(ready) 안에서만 접근
              private val ready = HashMap<Int, Done>()
              private var nextShow = 0
              private val recent = ArrayList<String>()
              private var nOk = 0
              private var sumMs = 0L

              override fun onBind(i: Intent?): IBinder? = null

              /** 시작 실패 원인을 사용자에게 보여주고 종료 */
              private fun fail(msg: String) {
                  Handler(Looper.getMainLooper()).post {
                      Toast.makeText(applicationContext, msg, Toast.LENGTH_LONG).show()
                  }
                  stopSelf()
              }

              @Suppress("DEPRECATION")
              private fun readData(i: Intent?): Intent? =
                  if (Build.VERSION.SDK_INT >= 33) i?.getParcelableExtra("data", Intent::class.java)
                  else i?.getParcelableExtra<Intent>("data")

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val rc = intent?.getIntExtra("resultCode", Activity.RESULT_CANCELED) ?: Activity.RESULT_CANCELED
                  val data = readData(intent)
                  if (rc != Activity.RESULT_OK || data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (running) return START_NOT_STICKY

                  // 1) 반드시 getMediaProjection() 보다 먼저 포그라운드 시작 (Android 14 요구사항)
                  startForeground(1, buildNotification("영상 소리를 캡처해 한글 자막으로 번역 중"), ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)

                  if (ContextCompat.checkSelfPermission(this, android.Manifest.permission.RECORD_AUDIO) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      fail("녹음 권한이 없어요. 앱 설정에서 허용해 주세요")
                      return START_NOT_STICKY
                  }

                  try {
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      val p = mpm.getMediaProjection(rc, data)
                      projection = p
                      // 사용자가 퀵패널에서 캡처를 끄면 서비스 종료
                      p.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() { stopSelf() }
                      }, null)

                      // 2) 내부 오디오만 (마이크 아님)
                      val cfg = AudioPlaybackCaptureConfiguration.Builder(p)
                          .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          .addMatchingUsage(AudioAttributes.USAGE_GAME)
                          .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                          .build()
                      val fmt = AudioFormat.Builder()
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setSampleRate(16000)
                          .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                          .build()
                      val rec = AudioRecord.Builder()
                          .setAudioFormat(fmt)
                          .setAudioPlaybackCaptureConfig(cfg)
                          .setBufferSizeInBytes(2 * 1024 * 1024)
                          .build()
                      if (rec.state != AudioRecord.STATE_INITIALIZED) {
                          rec.release()
                          fail("내부 오디오 캡처를 시작하지 못했어요 (이 기기/설정에서 미지원)")
                          return START_NOT_STICKY
                      }
                      record = rec
                  } catch (e: Exception) {
                      fail("캡처 시작 실패: " + (e.message ?: e.javaClass.simpleName))
                      return START_NOT_STICKY
                  }

                  startService(Intent(this, FloatingSubtitleService::class.java))
                  running = true
                  val rec = record!!
                  capThread = Thread { captureLoop(rec) }.also { it.start() }
                  for (i in 0 until 2) {
                      val t = Thread { workLoop() }
                      t.isDaemon = true
                      t.start()
                      workers.add(t)
                  }
                  return START_NOT_STICKY
              }

              /** 100ms 단위로 읽으면서 말소리 구간을 잘라 번역 대기열에 넣는다 */
              private fun captureLoop(rec: AudioRecord) {
                  val frame = ShortArray(Segmenter.FRAME)
                  val seg = Segmenter()
                  var peak = 0.0
                  val start = System.currentTimeMillis()
                  var lastDiag = start
                  var lastActive = start
                  try {
                      rec.startRecording()
                      while (running) {
                          val n = rec.read(frame, 0, frame.size)
                          if (n < 0) break
                          if (n == 0) continue
                          val out = seg.feed(frame, n)
                          val rms = seg.lastRms
                          if (rms > peak) peak = rms
                          val now = System.currentTimeMillis()
                          if (rms > Segmenter.MIN_THRESH) lastActive = now
                          if (out != null) submit(out)

                          if (now - lastDiag >= 15000) {
                              if (peak < 40.0) {
                                  FloatingSubtitleService.show("소리가 안 잡혀요 - 영상이 재생 중인지, 이 앱이 캡처를 막는지 확인하세요", 8000, true)
                              }
                              peak = 0.0
                              lastDiag = now
                          }
                          if (now - lastActive >= IDLE_MS) {
                              Handler(Looper.getMainLooper()).post {
                                  Toast.makeText(applicationContext, "10분간 소리가 없어 자동 종료했어요", Toast.LENGTH_LONG).show()
                              }
                              stopSelf()
                              break
                          }
                      }
                  } catch (e: Exception) {
                      // 종료 중 stop()/release() 와의 경합은 무시
                  }
              }

              private fun submit(pcm: ShortArray) {
                  queue.addLast(Job(seqGen.getAndIncrement(), pcm, System.nanoTime()))
                  // 밀리면 가장 오래된 것을 버려서 지연이 쌓이지 않게 함
                  while (queue.size > 3) {
                      val old = queue.pollFirst() ?: break
                      deliver(old.seq, null, 0L)
                  }
              }

              private fun workLoop() {
                  while (running) {
                      var j: Job? = null
                      try {
                          j = queue.poll(500, TimeUnit.MILLISECONDS)
                      } catch (e: InterruptedException) {
                          break
                      }
                      val job = j ?: continue
                      val cfg = Cfg.load(this)
                      val prev = synchronized(ready) { ArrayList(recent) }
                      val r = Translator.translate(job.pcm, cfg, prev)
                      if (!running) break
                      val ms = (System.nanoTime() - job.t0) / 1_000_000L
                      deliver(job.seq, r, ms)
                      val err = r.error
                      if (err != null && err.startsWith("요청 한도")) {
                          try { Thread.sleep(3000) } catch (e: InterruptedException) { break }
                      }
                  }
              }

              /** 결과를 번호 순서대로 화면에 올린다 (먼저 끝난 번역이 순서를 앞지르지 않게) */
              private fun deliver(seq: Int, r: TranslateResult?, ms: Long) {
                  var notify = false
                  synchronized(ready) {
                      ready[seq] = Done(r, ms)
                      while (ready.containsKey(nextShow)) {
                          val d = ready.remove(nextShow)
                          nextShow++
                          val x = d?.r ?: continue
                          val err = x.error
                          val txt = x.text
                          if (err != null) {
                              FloatingSubtitleService.show("⚠ " + err, 6000, true)
                          } else if (txt != null) {
                              recent.add(txt)
                              while (recent.size > 2) recent.removeAt(0)
                              nOk++
                              sumMs += d.ms
                              notify = true
                              FloatingSubtitleService.show(txt, (3500L + 100L * txt.length).coerceAtMost(9000L), false)
                          }
                      }
                  }
                  if (notify) updateNotification()
              }

              private fun updateNotification() {
                  val text: String
                  synchronized(ready) {
                      val avg = if (nOk > 0) sumMs / nOk / 1000.0 else 0.0
                      text = "번역 " + nOk + "건 · 평균 지연 " + "%.1f".format(avg) + "초"
                  }
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(1, buildNotification(text))
              }

              private fun buildNotification(text: String): Notification {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel(CHANNEL, "번역", NotificationManager.IMPORTANCE_LOW))
                  val stopIntent = Intent(this, AudioCaptureService::class.java).setAction(ACTION_STOP)
                  val pi = PendingIntent.getService(this, 0, stopIntent, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val act = Notification.Action.Builder(
                      Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel), "중지", pi
                  ).build()
                  return Notification.Builder(this, CHANNEL)
                      .setContentTitle("내부오디오 번역 중")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .addAction(act)
                      .build()
              }

              override fun onDestroy() {
                  running = false
                  queue.clear()
                  for (t in workers) t.interrupt()
                  try { record?.stop() } catch (e: Exception) { }
                  capThread?.join(500)
                  try { record?.release() } catch (e: Exception) { }
                  try { projection?.stop() } catch (e: Exception) { }
                  stopService(Intent(this, FloatingSubtitleService::class.java))
                  super.onDestroy()
              }

              companion object {
                  private const val ACTION_STOP = "com.realtime.translator.STOP"
                  private const val CHANNEL = "trans"
                  private const val IDLE_MS = 10 * 60 * 1000L
              }
          }
