          cat > app/src/main/java/com/realtime/translator/service/Segmenter.kt <<'EOF'
          package com.realtime.translator.service

          import kotlin.math.sqrt

          /**
           * 100ms 프레임을 계속 넣으면 "말소리 한 덩어리"가 끝날 때마다 PCM 을 돌려준다.
           * - 배경 소음 수준을 따라가는 적응형 문턱 (조용한 방 ~ 시끄러운 배경음악)
           * - 0.5초 쉬면 문장 끝, 3초 넘게 말하다 짧게 쉬면 미리 끊어서 지연 감소, 최대 6초
           */
          class Segmenter {
              private val seg = ShortArray(MAX + FRAME * 2)
              private val pre = ShortArray(FRAME)
              private var preLen = 0
              private var len = 0
              private var speech = 0
              private var quiet = 0
              private var inSeg = false
              private var noise = 100.0

              var lastRms = 0.0
                  private set

              fun feed(f: ShortArray, n: Int): ShortArray? {
                  var sum = 0.0
                  for (k in 0 until n) {
                      val s = f[k].toDouble()
                      sum += s * s
                  }
                  val rms = sqrt(sum / n)
                  lastRms = rms

                  val thr = (noise * 2.0).coerceIn(MIN_THRESH, MAX_THRESH)
                  val loud = rms > thr
                  // 소음 수준 추적: 내려갈 땐 빠르게, 올라갈 땐 아주 천천히
                  // (처음부터 시끄러운 배경음악도 몇 초 안에 "배경"으로 인식, 짧은 대사는 거의 영향 없음)
                  noise = if (rms < noise) noise * 0.9 + rms * 0.1 else noise + (rms - noise) * 0.005

                  var out: ShortArray? = null
                  if (!inSeg && loud) {
                      inSeg = true
                      len = 0
                      speech = 0
                      quiet = 0
                      if (preLen > 0) {            // 말 시작 직전 100ms 보존
                          System.arraycopy(pre, 0, seg, 0, preLen)
                          len = preLen
                      }
                  }
                  if (inSeg) {
                      System.arraycopy(f, 0, seg, len, n)
                      len += n
                      if (loud) {
                          speech++
                          quiet = 0
                      } else {
                          quiet++
                      }
                      val end = quiet >= QUIET_END || (len >= SOFT_LEN && quiet >= 2) || len + FRAME > MAX
                      if (end) {
                          if (speech >= MIN_SPEECH) out = seg.copyOf(len)
                          inSeg = false
                          len = 0
                          speech = 0
                          quiet = 0
                      }
                  }
                  System.arraycopy(f, 0, pre, 0, n)
                  preLen = n
                  return out
              }

              companion object {
                  const val FRAME = 1600              // 100ms @16kHz
                  const val MAX = 16000 * 6           // 한 덩어리 최대 6초
                  const val SOFT_LEN = 16000 * 3      // 3초 넘으면 짧은 쉼에도 끊음
                  const val QUIET_END = 5             // 0.5초 조용하면 문장 끝
                  const val MIN_SPEECH = 5            // 최소 0.5초는 소리가 있어야 번역
                  const val MIN_THRESH = 300.0
                  const val MAX_THRESH = 1500.0
              }
          }
          EOF

          cat > app/src/main/java/com/realtime/translator/service/Sub.kt <<'EOF'
          package com.realtime.translator.service

          /** 프롬프트 생성과 모델 출력 정리 (안드로이드 의존 없음) */
          object Sub {
              fun prompt(lang: String, glossary: String, prev: List<String>): String {
                  val l = when (lang) {
                      "ja" -> "일본어"
                      "zh" -> "중국어"
                      "en" -> "영어"
                      "ru" -> "러시아어"
                      else -> "일본어, 중국어, 영어, 러시아어 중 하나"
                  }
                  val sb = StringBuilder()
                  sb.append("너는 실시간 영상(주로 애니메이션) 자막 번역기다. 입력 음성의 언어는 ").append(l).append("이다. ")
                  sb.append("들린 대사를 자연스러운 한국어 구어체 자막으로 번역해서 번역문만 출력해라. ")
                  sb.append("원문, 설명, 따옴표, 화자 표시, 괄호 설명은 쓰지 마라. ")
                  sb.append("말투(반말/존댓말)는 화자의 분위기에 맞추고, 한 줄은 짧고 읽기 쉽게 써라. ")
                  sb.append("대사가 없거나 음악, 효과음, 소음뿐이면 정확히 NONE 이라고만 출력해라.")
                  if (glossary.isNotBlank()) {
                      sb.append("\n용어집(이 표기를 우선 사용): ").append(glossary.trim().take(500))
                  }
                  if (prev.isNotEmpty()) {
                      sb.append("\n직전 자막(문맥 참고용, 다시 출력하지 마라): ").append(prev.joinToString(" / "))
                  }
                  return sb.toString()
              }

              /** 자막으로 쓸 수 없는 출력(NONE, (음악) 같은 상황 설명)은 null */
              fun clean(raw: String): String? {
                  var t = raw.replace("\n", " ").trim()
                  if (t.isEmpty()) return null
                  if (t.startsWith("NONE", ignoreCase = true)) return null
                  t = t.trim('"', '“', '”', '「', '」', '『', '』').trim()
                  if (t.isEmpty()) return null
                  val wrapped = (t.startsWith("(") && t.endsWith(")")) ||
                      (t.startsWith("[") && t.endsWith("]")) ||
                      (t.startsWith("（") && t.endsWith("）"))
                  if (wrapped && t.length < 24) return null
                  return t
              }
          }
