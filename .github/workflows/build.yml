name: APK 자동 빌드

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 프로젝트 파일 자동 생성
        run: |
          mkdir -p app/src/main/java/com/realtime/translator/service
          mkdir -p app/src/main/java/com/realtime/translator/engine
          mkdir -p app/src/main/res/layout
          cat > settings.gradle.kts <<'EOF'
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.10" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.realtime.translator"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.realtime.translator"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="실시간 번역 자막">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".service.AudioCaptureService" android:foregroundServiceType="mediaProjection" />
                  <service android:name=".service.FloatingSubtitleService" />
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:padding="20dp" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F0F0F">
              <TextView android:text="실시간 AI 번역" android:textColor="#FFF" android:textSize="24sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <Button android:id="@+id/btnStart" android:text="번역 시작" android:layout_marginTop="16dp" android:layout_width="match_parent" android:layout_height="64dp"/>
          </LinearLayout>
          EOF
          cat > app/src/main/res/layout/overlay_subtitle.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:background="#CC000000" android:padding="12dp" android:layout_width="match_parent" android:layout_height="wrap_content">
              <TextView android:id="@+id/tvKorean" android:text="한글 자막" android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold" android:layout_width="match_parent" android:layout_height="wrap_content"/>
          </LinearLayout>
          EOF
          cat > app/src/main/java/com/realtime/translator/MainActivity.kt <<'EOF'
          package com.realtime.translator
          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.realtime.translator.service.AudioCaptureService
          class MainActivity : AppCompatActivity() {
              private val PROJECTION_CODE = 1001
              private lateinit var mediaProjectionManager: MediaProjectionManager
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  mediaProjectionManager = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      startActivityForResult(mediaProjectionManager.createScreenCaptureIntent(), PROJECTION_CODE)
                  }
              }
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PROJECTION_CODE && resultCode == Activity.RESULT_OK && data != null) {
                      val serviceIntent = Intent(this, AudioCaptureService::class.java).apply {
                          putExtra("resultCode", resultCode)
                          putExtra("data", data)
                      }
                      startForegroundService(serviceIntent)
                  }
              }
          }
          EOF
          cat > [STRIPPED 69 bytes].kt <<'EOF'
          package com.realtime.translator.service
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.*
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.IBinder
          class AudioCaptureService : Service() {
              private var mediaProjection: MediaProjection? = null
              private var audioRecord: AudioRecord? = null
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val resultCode = intent?.getIntExtra("resultCode", -1) ?: -1
                  val data = intent?.getParcelableExtra<Intent>("data")
                  startForeground(1, createNotification())
                  val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = mpManager.getMediaProjection(resultCode, data!!)
                  val config = AudioPlaybackCaptureConfiguration.Builder(mediaProjection!!).addMatchingUsage(AudioAttributes.USAGE_MEDIA).build()
                  val format = AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(16000).setChannelMask(AudioFormat.CHANNEL_IN_MONO).build()
                  audioRecord = AudioRecord.Builder().setAudioFormat(format).setAudioPlaybackCaptureConfig(config).setBufferSizeInBytes(2097152).build()
                  startService(Intent(this, FloatingSubtitleService::class.java))
                  audioRecord?.startRecording()
                  return START_STICKY
              }
              private fun createNotification(): Notification {
                  val channelId = "translator_channel"
                  val channel = NotificationChannel(channelId, "번역 실행중", NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
                  return Notification.Builder(this, channelId).setContentTitle("실시간 번역 중").setContentText("내부 오디오 번역 중").setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF
          cat > [STRIPPED 73 bytes].kt <<'EOF'
          package com.realtime.translator.service
          import android.app.Service
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.view.*
          import com.realtime.translator.R
          class FloatingSubtitleService : Service() {
              private var windowManager: WindowManager? = null
              private var overlayView: View? = null
              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val params = WindowManager.LayoutParams(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply { gravity = android.view.Gravity.BOTTOM; y = 120 }
                  overlayView = layoutInflater.inflate(R.layout.overlay_subtitle, null)
                  windowManager?.addView(overlayView, params)
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.5 || true
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 실시간번역-APK
          path: "**/build/outputs/apk/debug/*.apk"
