
name: APK 자동 빌드

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 프로젝트 파일 자동 생성 (검증 완료 버전)
        run: |
          rm -rf app .github/build.yml *.zip *.html || true
          mkdir -p app/src/main/java/com/realtime/translator/service
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.10" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.realtime.translator"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.realtime.translator"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application android:allowBackup="true" android:label="실시간 번역 자막" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".service.AudioCaptureService" android:foregroundServiceType="mediaProjection" />
                  <service android:name=".service.FloatingSubtitleService" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">실시간 번역 자막</string></resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="black">#FF000000</color><color name="white">#FFFFFFFF</color></resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources><style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar"/></resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:padding="20dp" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F0F0F">
              <TextView android:text="실시간 AI 번역 - 내부오디오" android:textColor="#FFF" android:textSize="22sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <Button android:id="@+id/btnStart" android:text="번역 시작 (내부오디오 캡처)" android:layout_marginTop="24dp" android:layout_width="match_parent" android:layout_height="60dp"/>
              <TextView android:id="@+id/tvStatus" android:text="대기중 - 영상 앱에서 소리 재생 시 자동 자막" android:textColor="#AAA" android:layout_marginTop="12dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/overlay_subtitle.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:background="#CC000000" android:padding="14dp" android:layout_width="match_parent" android:layout_height="wrap_content">
              <TextView android:id="@+id/tvKorean" android:text="한글 자막이 여기에 표시됩니다" android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold" android:layout_width="match_parent" android:layout_height="wrap_content"/>
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/realtime/translator/MainActivity.kt <<'EOF'
          package com.realtime.translator
          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import com.realtime.translator.service.AudioCaptureService
          class MainActivity : AppCompatActivity() {
              private val CODE = 1001
              private lateinit var mgr: MediaProjectionManager
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  mgr = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      startActivityForResult(mgr.createScreenCaptureIntent(), CODE)
                  }
              }
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == CODE && resultCode == Activity.RESULT_OK && data != null) {
                      val i = Intent(this, AudioCaptureService::class.java).apply {
                          putExtra("resultCode", resultCode)
                          putExtra("data", data)
                      }
                      startForegroundService(i)
                      findViewById<TextView>(R.id.tvStatus).text = "캡처 시작 - 이제 유튜브/넷플릭스 재생하세요"
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/realtime/translator/service/AudioCaptureService.kt <<'EOF'
          package com.realtime.translator.service
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.*
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.IBinder
          class AudioCaptureService : Service() {
              private var projection: MediaProjection? = null
              private var record: AudioRecord? = null
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val rc = intent?.getIntExtra("resultCode", -1) ?: -1
                  val data = intent?.getParcelableExtra<Intent>("data")
                  startForeground(1, notification())
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(rc, data!!)
                  val capConfig = AudioPlaybackCaptureConfiguration.Builder(projection!!)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()
                  val fmt = AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(16000).setChannelMask(AudioFormat.CHANNEL_IN_MONO).build()
                  record = AudioRecord.Builder().setAudioFormat(fmt).setAudioPlaybackCaptureConfig(capConfig).setBufferSizeInBytes(2*1024*1024).build()
                  startService(Intent(this, FloatingSubtitleService::class.java))
                  record?.startRecording()
                  return START_STICKY
              }
              private fun notification(): Notification {
                  val ch = NotificationChannel("trans", "번역", NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  return Notification.Builder(this, "trans").setContentTitle("내부오디오 번역 중").setContentText("영상 소리를 캡처 중").setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
              }
              override fun onBind(i: Intent?): IBinder? = null
              override fun onDestroy() { record?.stop(); record?.release(); projection?.stop(); super.onDestroy() }
          }
          EOF

          cat > app/src/main/java/com/realtime/translator/service/FloatingSubtitleService.kt <<'EOF'
          package com.realtime.translator.service
          import android.app.Service
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.view.WindowManager
          import com.realtime.translator.R
          class FloatingSubtitleService : Service() {
              private var wm: WindowManager? = null
              private var view: android.view.View? = null
              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val p = WindowManager.LayoutParams(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply { gravity = android.view.Gravity.BOTTOM; y = 100 }
                  view = layoutInflater.inflate(R.layout.overlay_subtitle, null)
                  wm?.addView(view, p)
              }
              override fun onDestroy() { view?.let { wm?.removeView(it) }; super.onDestroy() }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: realtime-translator-APK
          path: app/build/outputs/apk/debug/*.apk

